<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#faf8f5"/>
  <g transform="translate(20, 20)">
    <!-- Tile Slab Body -->
    <rect x="10" y="10" width="140" height="140" rx="6" fill="#f4eeea" stroke="#d9d2c9" stroke-width="3"/>
    <!-- Marble Veins effect -->
    <path d="M 20,30 Q 60,70 80,40 T 130,90 T 145,130" fill="none" stroke="#c09b5a" stroke-width="2.5" opacity="0.65"/>
    <path d="M 40,140 Q 80,100 110,120 T 140,50" fill="none" stroke="#a48043" stroke-width="1.5" opacity="0.45"/>
    <path d="M 15,90 Q 40,110 65,85" fill="none" stroke="#78716c" stroke-width="1" opacity="0.4"/>
    <!-- Glossy Highlight Diagonal -->
    <path d="M 10,10 L 150,150" stroke="#ffffff" stroke-width="8" opacity="0.4"/>
  </g>
</svg>
