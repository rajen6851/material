<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#faf8f5"/>
  <g transform="translate(25, 20)">
    <!-- Back wall mount -->
    <rect x="35" y="20" width="80" height="40" rx="8" fill="#e8e4dc" stroke="#d4cecf" stroke-width="2"/>
    <!-- WC Bowl Top Rim -->
    <ellipse cx="75" cy="80" rx="55" ry="35" fill="#ffffff" stroke="#c09b5a" stroke-width="3"/>
    <!-- Inner Bowl -->
    <ellipse cx="75" cy="80" rx="42" ry="25" fill="#f4eeea" stroke="#e8e4dc" stroke-width="2"/>
    <!-- Bowl Depth -->
    <ellipse cx="75" cy="82" rx="25" ry="14" fill="#d9d4cd"/>
    <ellipse cx="75" cy="84" rx="14" ry="7" fill="#b0a79d"/>
    <!-- Lower Body Contour -->
    <path d="M 25,80 C 25,125 45,150 75,150 C 105,150 125,125 125,80 Z" fill="#ffffff" stroke="#d4cecf" stroke-width="2.5"/>
    <path d="M 35,90 C 35,120 50,140 75,140 C 100,140 115,120 115,90 Z" fill="#fbf9f6" opacity="0.7"/>
    <!-- Seat Cover Lid Line -->
    <ellipse cx="75" cy="65" rx="52" ry="12" fill="none" stroke="#d4cecf" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
</svg>
