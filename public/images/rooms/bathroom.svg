<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#115e59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#134e4a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" rx="8" />
  
  <circle cx="700" cy="100" r="150" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="100" cy="500" r="100" fill="#ffffff" fill-opacity="0.03" />
  <polygon points="120,40 180,90 100,120" fill="#ffffff" fill-opacity="0.04" />
  
  <g transform="translate(400, 300)">
    <text text-anchor="middle" fill="#ffffff" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="44" filter="url(#shadow)" letter-spacing="1">Bathroom Collection</text>
    <text text-anchor="middle" y="55" fill="#ffffff" fill-opacity="0.7" font-family="'Segoe UI', sans-serif" font-weight="400" font-size="20">Premium Building Materials</text>
    
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  </g>
</svg>